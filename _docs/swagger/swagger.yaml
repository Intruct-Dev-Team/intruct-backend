basePath: /api
definitions:
  course.createCourseResponse:
    description: createCourseResponse returns created course ID
    properties:
      course_id:
        example: 1
        type: integer
    type: object
  httputils.ErrorStruct:
    properties:
      error:
        type: string
    type: object
  user.completeRegistrationRequest:
    description: completeRegistrationRequest to complete user registration.
    properties:
      avatar:
        example: base64 encoded image
        type: string
      birthdate:
        example: "2000-01-01T00:00:00Z"
        type: string
      name:
        example: John
        type: string
      surname:
        example: Smith
        type: string
    required:
    - birthdate
    - name
    - surname
    type: object
  user.getUserResponse:
    properties:
      avatar:
        example: uuid.png
        type: string
      birthdate:
        example: "2002-09-09T10:10:10+09:00"
        type: string
      email:
        example: qwerty@example.com
        type: string
      external_uuid:
        example: uuid
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John
        type: string
      registration_date:
        example: "2022-09-09T10:10:10+09:00"
        type: string
      surname:
        example: Smith
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: ruslanrbb8@gmail.com
    name: Ruslan's Support
    url: https://t.me/Ruslan20007
  description: back-end part for mobile application.
  title: Intruct API
  version: "1.0"
paths:
  /auth/complete-registration:
    post:
      consumes:
      - application/json
      description: |-
        Complete registration by providing additional profile information
        Prerequisites: User must be authenticated via External service (Supabase Auth)
        This endpoint creates user profile in application database
      parameters:
      - description: Profile Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.completeRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Invalid request or validation failed
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "401":
          description: External auth is missing or invalid
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "409":
          description: User already completed registration
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      security:
      - BearerAuth: []
      summary: Complete registration
      tags:
      - auth
  /course:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Create a new course with title, description, file and language
        Prerequisites: User must be authenticated
      parameters:
      - description: Course title
        in: formData
        name: title
        required: true
        type: string
      - description: Course description
        in: formData
        name: description
        required: true
        type: string
      - description: Course file
        in: formData
        name: file
        required: true
        type: file
      - description: Course language
        in: formData
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/course.createCourseResponse'
        "400":
          description: Invalid request or validation failed
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      security:
      - BearerAuth: []
      summary: Create course
      tags:
      - course
  /user/profile:
    get:
      description: 'Get info about user by jwt token (in Authorization enter: Bearer
        <your_jwt_token>)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.getUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
  /users/{id}/profile:
    get:
      description: Get info about user by user id in route (/api/users/{id}/profile)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.getUserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      summary: Get user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
