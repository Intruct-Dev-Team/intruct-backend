basePath: /api
definitions:
  course.createCourseResponse:
    description: createCourseResponse returns created course ID
    properties:
      course_id:
        example: 1
        type: integer
    type: object
  course.uploadCourseRequest:
    description: uploadCourseRequest contains processed course content from n8n
    properties:
      course_title:
        example: Introduction to Programming
        type: string
      language:
        example: Russian
        type: string
      last_updated:
        example: "2026-01-06T16:57:59.272Z"
        type: string
      modules:
        items:
          $ref: '#/definitions/course.uploadModuleRequest'
        type: array
      total_lessons:
        example: 60
        type: integer
      total_modules:
        example: 10
        type: integer
    required:
    - course_title
    - language
    - last_updated
    - modules
    - total_lessons
    - total_modules
    type: object
  course.uploadLessonRequest:
    properties:
      content:
        example: '...'
        type: string
      lesson_id:
        example: 1
        type: integer
      lesson_title:
        example: Lesson 1.1
        type: string
      quiz:
        items:
          $ref: '#/definitions/course.uploadQuizRequest'
        type: array
    required:
    - content
    - lesson_id
    - lesson_title
    type: object
  course.uploadModuleRequest:
    properties:
      lessons:
        items:
          $ref: '#/definitions/course.uploadLessonRequest'
        type: array
      module_id:
        example: 1
        type: integer
      module_title:
        example: Module 1
        type: string
    required:
    - lessons
    - module_id
    - module_title
    type: object
  course.uploadQuizRequest:
    properties:
      correct_index:
        example: 1
        type: integer
      options:
        example:
        - "1"
        - "2"
        - "3"
        - "4"
        items:
          type: string
        type: array
      question:
        example: What is 2+2?
        type: string
    required:
    - correct_index
    - options
    - question
    type: object
  httputils.ErrorStruct:
    properties:
      error:
        type: string
    type: object
  language.getLanguagesResponse:
    description: get languages getLanguagesResponse.
    properties:
      languages:
        items:
          type: string
        type: array
    type: object
  user.completeRegistrationRequest:
    description: completeRegistrationRequest to complete user registration.
    properties:
      avatar:
        example: base64 encoded image
        type: string
      birthdate:
        example: "2000-01-01T00:00:00Z"
        type: string
      name:
        example: John
        type: string
      surname:
        example: Smith
        type: string
    required:
    - birthdate
    - name
    - surname
    type: object
  user.getUserResponse:
    properties:
      avatar:
        example: uuid.png
        type: string
      birthdate:
        example: "2002-09-09T10:10:10+09:00"
        type: string
      completed_courses:
        example: 1
        type: integer
      email:
        example: qwerty@example.com
        type: string
      external_uuid:
        example: uuid
        type: string
      id:
        example: 1
        type: integer
      in_progress_courses:
        example: 1
        type: integer
      name:
        example: John
        type: string
      registration_date:
        example: "2022-09-09T10:10:10+09:00"
        type: string
      surname:
        example: Smith
        type: string
    type: object
host: localhost:80
info:
  contact:
    email: ruslanrbb8@gmail.com
    name: Ruslan's Support
    url: https://t.me/Ruslan20007
  description: back-end part for mobile application.
  title: Intruct API
  version: "1.0"
paths:
  /auth/complete-registration:
    post:
      consumes:
      - application/json
      description: |-
        Complete registration by providing additional profile information
        Prerequisites: User must be authenticated via External service (Supabase Auth)
        This endpoint creates user profile in application database
      parameters:
      - description: Profile Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.completeRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Invalid request or validation failed
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "401":
          description: External auth is missing or invalid
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "409":
          description: User already completed registration
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      security:
      - BearerAuth: []
      summary: Complete registration
      tags:
      - auth
  /course:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Create a new course with title, description, file and language
        Prerequisites: User must be authenticated
      parameters:
      - description: Course title
        in: formData
        name: title
        required: true
        type: string
      - description: Course description
        in: formData
        name: description
        type: string
      - description: Course file
        in: formData
        name: file
        required: true
        type: file
      - description: Course language
        in: formData
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/course.createCourseResponse'
        "400":
          description: Invalid request or validation failed
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      security:
      - BearerAuth: []
      summary: Create course
      tags:
      - course
  /courses/{course_id}/upload:
    patch:
      consumes:
      - application/json
      description: |-
        Upload processed course content with modules, lessons and quizzes from n8n workflow
        This endpoint fills the course with educational content after file processing
      parameters:
      - description: Course ID
        in: path
        name: course_id
        required: true
        type: integer
      - description: Course Content Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/course.uploadCourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid request or validation failed
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "404":
          description: Course not found
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      summary: Upload course content
      tags:
      - course
  /languages:
    get:
      description: Get list of all languages
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/language.getLanguagesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      summary: Get languages
      tags:
      - languages
  /user/profile:
    get:
      description: 'Get info about user by jwt token (in Authorization enter: Bearer
        <your_jwt_token>)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.getUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
  /users/{id}/profile:
    get:
      description: Get info about user by user id in route (/api/users/{id}/profile)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.getUserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.ErrorStruct'
      summary: Get user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
