worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ========================================
    # SECURITY AND LIMITS (from the old config)
    # ========================================
    client_max_body_size 128m;
    # Rate limiting: 50 requests per second per IP
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=50r/s;
    # Connection limiting: max connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    # Timeouts (protection against slowloris and hanging connections)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # ========================================
    # WEBSOCKET SETTINGS
    # ========================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile on;

    # ========================================
    # HTTP → HTTPS REDIRECT
    # ========================================
    server {
        listen 80;
        server_name intruct.com;

        # For Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # ========================================
    # MAIN HTTPS SERVER
    # ========================================
    server {
        listen 443 ssl;
        server_name intruct.com;

        ssl_certificate /etc/letsencrypt/live/intruct.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/intruct.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # n8n automation
        location /n8n/webhook/ {
            proxy_pass http://n8n_webhook:5678/webhook/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /n8n;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Apply rate limiting for n8n
            limit_req zone=req_limit_per_ip burst=100 nodelay;
        }

        location /n8n/webhook-test/ {
            proxy_pass http://n8n_webhook:5678/webhook-test/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /n8n;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Apply rate limiting for n8n
            limit_req zone=req_limit_per_ip burst=100 nodelay;
        }

        location /n8n/ {
            proxy_pass http://n8n_main:5678/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /n8n;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_buffering off;
            proxy_connect_timeout 3600s;
	        proxy_read_timeout 3600s;
	        proxy_send_timeout 3600s;
            # Apply rate limiting for n8n
            limit_req zone=req_limit_per_ip burst=100 nodelay;
        }

        # Main application
        location /api/ {
            # Apply limits (from the old config)
            limit_conn addr 15;
            limit_req zone=req_limit_per_ip burst=20 nodelay;

            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api {
            return 301 /api/;
        }

        location /swagger/ {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /swagger {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static landing page
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}